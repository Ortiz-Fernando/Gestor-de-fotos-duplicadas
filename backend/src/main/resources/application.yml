server:
  address: localhost
  port: 8080

spring:
  application:
    name: image-duplicate-manager
  datasource:
    url: jdbc:sqlite:../data/database/images.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: PRAGMA busy_timeout=5000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false

duplicate:
  perceptual:
    threshold: 10          # banda "posible duplicado visual" (calibrado Fase 10)
    review-threshold: 17   # banda "similar -> revision humana" (calibrado Fase 10)
  visual:
    dimension-filter-enabled: true

logging:
  level:
    root: INFO
